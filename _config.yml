# About Section
about_title: About Me
about_profile_image: images/profile.jpg
about_content: | # this will include new lines to allow paragraphs
  현재 카카오 <mark>Kanvas TF</mark>에서 AI 제품을 개발하고 있습니다.
  2025년에는 사내 AI 검색 시스템을 선례가 없는 상태에서 구조부터 설계해 <mark>API 비용을 94%</mark>, 토큰을 50% 절감했습니다. 같은 해 하반기부터 2026년 초까지는 AI 활용 능력 대회 플랫폼 AITOP100의 시스템을 설계·구현했고, 그 전 AI Native Company TF에서는 GraphRAG로 지식베이스를 구축했습니다.

  AI 이전에는 대규모 서비스 백엔드를 다뤘습니다. <mark>하루 수억 건</mark>의 메일을 주고받는 <mark>MAU 2천만 이상</mark>의 다음메일을 **8년 이상** 개발/운영하면서, 20년 넘은 서비스의 인프라, 모니터링, 장애 상황을 두루 경험하였습니다.
  My 구독 서비스는 신규 개발에 참여하여 론칭하였고, 티스토리, 오픈링크, 오픈채팅 등의 서비스 개발에도 참여하였습니다.

  일을 하며 쌓은 경험들은 문서화하고 동료들과 공유합니다.
  반복되는 작업은 스크립트로 자동화하고 운영툴을 개발하여 운영비용을 줄입니다.

