about_title: About Me
about_content: | # this will include new lines to allow paragraphs
  I have server-side development and operations experience on <mark>Daum Mail</mark>, a service with <mark>over 20 million MAU</mark> handling <mark>hundreds of millions of emails</mark> per day.
  Running a <mark>20-year-old</mark> service at that scale for **more than 8 years** exposed me to a wide range of infrastructure, development and monitoring environments, and to handling many kinds of production incidents.

  I helped build and launch the My Subscription service from scratch, and contributed to Tistory, OpenLink and OpenChat.
  On the AI Native Company TF I worked on building a GraphRAG-based knowledge base, and I am currently developing AI services on the Kanvas TF.

  I document what I learn and share it with my colleagues.
  I automate repetitive work with scripts and build internal tools to reduce operational cost.

